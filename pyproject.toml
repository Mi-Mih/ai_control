[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-control"
version = "0.1.0"
description = "Telegram control plane for local Codex, Claude Code, and Cursor Agent sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.15,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0.2,<7",
  "keyring>=25.5,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]
windows = ["pywin32>=308; sys_platform == 'win32'"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
ai-control = "ai_control.main:main"

[tool.hatch.build.targets.wheel]
packages = ["ai_control"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"ai_control/setup.py" = ["S603", "S607"]
"ai_control/security/secrets.py" = ["S110"]
"ai_control/bot/handlers.py" = ["ASYNC240"]
"ai_control/doctor.py" = ["ASYNC240"]
"ai_control/git/service.py" = ["ASYNC240"]
